name: "Lint"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"

      - name: "Lint"
        uses: astral-sh/ruff-action@v3

      - name: "Check formatting"
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check --diff"

  pytest:
    name: "Tests"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"

      - name: "Set up Python"
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.13"

      - name: "Install dependencies"
        run: python -m pip install "homeassistant==2025.8.0" "pycares<5" "pytest-homeassistant-custom-component==0.13.269"

      - name: "Run tests"
        run: python -m pytest
